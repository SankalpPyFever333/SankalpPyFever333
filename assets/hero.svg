<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Sankalp Pandey — Full Stack Product Engineer across apps, AI agents, APIs and infrastructure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08121f"/>
      <stop offset="52%" stop-color="#172a43"/>
      <stop offset="100%" stop-color="#02435e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0080ee"/>
      <stop offset="55%" stop-color="#3fd3ff"/>
      <stop offset="100%" stop-color="#dba54d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0080ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0080ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dba54d" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#dba54d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#5fd0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="300" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)" font-family="Segoe UI, Ubuntu, Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <circle cx="220" cy="60" r="240" fill="url(#glowA)">
      <animate attributeName="cx" values="220;360;220" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;120;60" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="250" r="220" fill="url(#glowB)">
      <animate attributeName="cx" values="980;860;980" dur="21s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;190;250" dur="15s" repeatCount="indefinite"/>
    </circle>

    <rect x="-400" y="0" width="360" height="300" fill="url(#sheen)" transform="skewX(-18)">
      <animate attributeName="x" values="-460;1320;1320" keyTimes="0;0.55;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(990 150)">
      <circle r="118" fill="none" stroke="#3fd3ff" stroke-opacity="0.16" stroke-width="1"/>
      <circle r="82" fill="none" stroke="#dba54d" stroke-opacity="0.20" stroke-width="1"/>
      <circle r="46" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <circle cx="118" cy="0" r="5" fill="#3fd3ff"/>
        <circle cx="-59" cy="102" r="4" fill="#0080ee"/>
        <circle cx="-59" cy="-102" r="3.5" fill="#8fe3ff"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
        <circle cx="82" cy="0" r="4" fill="#dba54d"/>
        <circle cx="0" cy="82" r="3" fill="#f6bf86"/>
        <circle cx="-82" cy="0" r="4" fill="#dba54d"/>
        <circle cx="0" cy="-82" r="3" fill="#f6bf86"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
        <circle cx="46" cy="0" r="3" fill="#ffffff" fill-opacity="0.75"/>
        <circle cx="-46" cy="0" r="3" fill="#ffffff" fill-opacity="0.45"/>
      </g>

      <circle r="26" fill="#0b1b2e" stroke="url(#accent)" stroke-width="2"/>
      <circle r="26" fill="none" stroke="#3fd3ff" stroke-width="1.5" opacity="0.7">
        <animate attributeName="r" values="26;44;26" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="6" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="1">SP</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.15s" fill="freeze"/>
      <text x="64" y="112" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="0.5">Sankalp Pandey</text>
    </g>

    <rect x="66" y="128" height="4" rx="2" width="330" fill="url(#accent)">
      <animate attributeName="width" values="0;330" dur="0.9s" begin="0.5s" fill="freeze"/>
    </rect>

    <g opacity="1">
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.8s" fill="freeze"/>
      <text x="66" y="172" font-size="21" font-weight="600" fill="#7fd4ff" letter-spacing="0.4">Full Stack Product Engineer</text>
      <text x="66" y="203" font-size="15" fill="#8ba2ba">Apps, AI agents, APIs and infrastructure. End-to-end ownership.</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.15s" fill="freeze"/>
      <g fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16">
        <rect x="66" y="228" width="78" height="28" rx="14"/>
        <rect x="152" y="228" width="70" height="28" rx="14"/>
        <rect x="230" y="228" width="92" height="28" rx="14"/>
        <rect x="330" y="228" width="80" height="28" rx="14"/>
        <rect x="418" y="228" width="72" height="28" rx="14"/>
      </g>
      <g font-size="12.5" font-weight="600" fill="#c9dced" text-anchor="middle" stroke="none">
        <text x="105" y="246">Flutter</text>
        <text x="187" y="246">Deno</text>
        <text x="276" y="246">Postgres</text>
        <text x="370" y="246">Docker</text>
        <text x="454" y="246">Nginx</text>
      </g>
    </g>

    <rect x="0" y="296" width="1200" height="4" fill="url(#accent)" opacity="0.85"/>
  </g>
</svg>
