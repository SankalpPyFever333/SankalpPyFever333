<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="footer-title footer-desc">
  <title id="footer-title">From commit to customer</title>
  <desc id="footer-desc">Sankalp Pandey's end-to-end delivery path from app and API development through cloud operations and Google Play publishing, including 10 Android apps published for clients.</desc>

  <defs>
    <linearGradient id="footer-bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#172a43"/>
      <stop offset="1" stop-color="#02435e"/>
    </linearGradient>
    <linearGradient id="footer-accent" x1="64" y1="0" x2="1136" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0080ee"/>
      <stop offset="0.52" stop-color="#3fd3ff"/>
      <stop offset="1" stop-color="#dba54d"/>
    </linearGradient>
    <radialGradient id="footer-glow-blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0080ee" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0080ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="footer-glow-gold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dba54d" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#dba54d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="footer-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7fd4ff" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="footer-card">
      <rect width="1200" height="260" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footer-card)" font-family="Segoe UI, Ubuntu, Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect width="1200" height="260" fill="url(#footer-bg)"/>
    <rect width="1200" height="260" fill="url(#footer-grid)"/>
    <circle cx="88" cy="22" r="235" fill="url(#footer-glow-blue)"/>
    <circle cx="1120" cy="226" r="220" fill="url(#footer-glow-gold)"/>
    <rect width="1200" height="4" fill="url(#footer-accent)"/>
    <rect x="0.5" y="0.5" width="1199" height="259" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

    <g>
      <circle cx="72" cy="45" r="4" fill="#3fd3ff"/>
      <text x="86" y="50" font-size="14" font-weight="700" letter-spacing="2.6" fill="#7fd4ff">BUILD · SHIP · OPERATE</text>
      <text x="64" y="103" font-size="44" font-weight="700" letter-spacing="0.2" fill="#ffffff">From commit to customer.</text>
      <text x="66" y="137" font-size="17" fill="#b8cce0">Apps, APIs, infrastructure and release ownership.</text>
    </g>

    <g>
      <rect x="858" y="24" width="278" height="136" rx="18" fill="#ffffff" fill-opacity="0.055" stroke="#7fd4ff" stroke-opacity="0.28"/>
      <text x="882" y="51" font-size="12" font-weight="700" letter-spacing="2" fill="#7fd4ff">RELEASE PROOF</text>
      <text x="880" y="119" font-size="69" font-weight="700" fill="#f0ba62">10</text>
      <g font-size="15" font-weight="700" letter-spacing="0.7" fill="#ffffff">
        <text x="986" y="76">ANDROID APPS</text>
        <text x="986" y="98">PUBLISHED</text>
        <text x="986" y="120">FOR CLIENTS</text>
      </g>
      <path d="M882 133H1112" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="997" y="150" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1.4" fill="#9db4c9">GOOGLE PLAY CONSOLE</text>
    </g>

    <g>
      <path d="M104 198H1096" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" stroke-linecap="round"/>
      <path d="M104 198H1096" fill="none" stroke="url(#footer-accent)" stroke-width="2" stroke-linecap="round"/>

      <g fill="#071728" stroke="#3fd3ff" stroke-width="2">
        <circle cx="104" cy="198" r="18"/>
        <circle cx="434" cy="198" r="18"/>
        <circle cx="764" cy="198" r="18"/>
      </g>
      <circle cx="1096" cy="198" r="18" fill="#2a241c" stroke="#dba54d" stroke-width="2"/>

      <g font-size="11" font-weight="700" text-anchor="middle" fill="#d8e8f6">
        <text x="104" y="202">01</text>
        <text x="434" y="202">02</text>
        <text x="764" y="202">03</text>
      </g>
      <path d="M1088 198L1094 204L1105 191" fill="none" stroke="#f0ba62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <g fill="#d8e8f6" font-size="16" font-weight="700" letter-spacing="1.5" text-anchor="middle">
        <text x="104" y="235">APP</text>
        <text x="434" y="235">API</text>
        <text x="764" y="235">CLOUD</text>
        <text x="1096" y="235" fill="#f0ba62">STORE</text>
      </g>

      <g fill="#7fd4ff" fill-opacity="0.8">
        <path d="M263 193L271 198L263 203Z"/>
        <path d="M593 193L601 198L593 203Z"/>
        <path d="M923 193L931 198L923 203Z"/>
      </g>
    </g>
  </g>
</svg>
